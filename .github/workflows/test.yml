name: Test

# Solo verificación: nada se publica desde aquí. El despliegue a Cloudflare lo
# hace deploy.yml al publicar una release, de modo que un push a main es un
# paso de comprobación y no de publicación.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Un push nuevo invalida el run anterior de la misma rama: el código que se
  # acaba de subir es el único que interesa, y el anterior ya no se va a
  # fusionar.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Ningún job escribe en el repositorio. Los secrets son de Cloudflare y no
  # se leen en este workflow, así que el token por defecto —que en un push
  # desde un fork no tiene nada— es exactamente lo que hace falta.
  contents: read

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Las acciones van fijadas por SHA, no por etiqueta. Una etiqueta se puede
      # mover: si alguien publicase una versión nueva bajo `v7`, este workflow
      # ejecutaría ese código sin que nadie lo revisara. El SHA es inmutable, y
      # el comentario a su lado dice qué versión es para que siga siendo legible.
      # Actualizar: usa Dependabot, que propone el cambio de SHA con su etiqueta.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pnpm/action-setup y no `corepack`: en un runner de ubuntu-latest el
      # corepack viene en una versión distinta en cada imagen, y lo que instala
      # no es necesariamente el pnpm fijado en package.json.
      #
      # La versión va explícita en vez de dejar que la action la lea de
      # `packageManager`, para que se vea en el propio workflow. Si se cambia
      # ahí, hay que cambiarla aquí.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Node 24 (LTS activo). La 20 quedó EOL el 2026-04-30.
          node-version: '24'
          cache: 'pnpm'

      # `--frozen-lockfile`: si el lockfile no cuadra con package.json, falla en
      # vez de resolver versiones nuevas por su cuenta. En CI un install que
      # resuelve dependencias distintas de las del repo produce un build que
      # nadie puede reproducir.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `build` es `astro check && astro build` (ver package.json): el typecheck
      # va dentro del build a propósito, para que un `pnpm build` a mano tampoco
      # pueda publicar con errores de tipos.
      - name: Typecheck and build
        run: pnpm build

      # El sitemap se genera en el build y BaseHead lo enlaza desde todas las
      # páginas. Que falte significa que `site` no está puesto en astro.config.mjs
      # o que canonical apuntaría a una URL falsa, y eso no se ve mirando el
      # HTML de la home.
      - name: Verify sitemap and canonical domain
        run: |
          test -f dist/sitemap-index.xml
          grep -q 'https://gfqlab.com/' dist/sitemap-index.xml
          grep -q 'rel="canonical" href="https://gfqlab.com/' dist/index.html

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm audit` en modo "audit level=high": una vulnerabilidad alta o
      # crítica bloquea el merge. Las moderadas y bajas se registran sin parar
      # el proyecto, que con una base de dependencias tan grande acabaría
      # ignorando el job si fuera bloqueante por debajo de ese nivel.
      - name: pnpm audit
        run: pnpm audit --audit-level=high